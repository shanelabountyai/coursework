name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Ephemeral runner-local Postgres, gone when the job ends.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coursework_test?connection_limit=10&pool_timeout=20
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/coursework_test?connection_limit=10&pool_timeout=20
      AUTH_SECRET: ci-only-secret-not-for-real-use-0123456789abc
      APP_URL: http://localhost:7400
      TZ: America/Chicago # D-8: a non-UTC process zone so a Date-based day path would shift here, not just on a laptop
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: America/Chicago # a non-UTC server zone, like the laptop's, so the db timezone test can go red here
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # foundation:drift diffs against the v1.3.0 tag; a shallow checkout has no tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Coursework gate (docs/phase-1-tasks.md 1.12): engine purity and date bans, then the oracle agreement, then the
      # fixture freeze — fixtures:check runs AFTER course:eval so a product-code write into fixtures/ fails the tree check.
      # The clone repo carries no tags (the cloud session cannot push one, D-41), so drift is pinned to the commit
      # v1.3.0 points at. When Shane pushes the tag (`git push origin v1.3.0`) this becomes `npm run foundation:drift`.
      - run: npm run foundation:drift -- --base e8c0f74bc1670c217a3868746051abeb4b9890a0
      - run: npm run engine:lint
      - run: npm run course:eval
      - run: npm run progress:verify
      - run: npm run fixtures:check
      - run: createdb coursework_test
      - run: npx prisma migrate deploy
      # Phase 2 (task 2.11): the clone's migration SQL is hand-written (the sandbox has no schema engine), so
      # prove the applied database equals the Prisma schema — any column, index or FK the SQL got wrong fails here.
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema --exit-code
      - run: npx vitest run
      # Production build, served — the way it ships. login.spec.ts drives a real page.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # Spec §4 / §13.3: both modules deleted by the manifest, and the tree must still generate, typecheck, build and pass drift.
  modules-removed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run foundation:check-modules
