name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # addendum §2: off = the owner role (as every clone runs today); enforce = app_rw, NOBYPASSRLS. RLS is opt-in (D-23;
        # owner decision 2026-11-05): a clone runs the enforce leg once it sets the repo variable RLS_ENFORCE=1. The template always runs both.
        rls: ${{ fromJSON((github.repository == 'shanelabountyai/saas-foundation' || vars.RLS_ENFORCE == '1') && '["off","enforce"]' || '["off"]') }}
    env:
      # Ephemeral runner-local Postgres, gone when the job ends.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coursework_test?connection_limit=10&pool_timeout=20
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/coursework_test?connection_limit=10&pool_timeout=20
      AUTH_SECRET: ci-only-secret-not-for-real-use-0123456789abc
      APP_URL: http://localhost:7400
      TZ: America/Chicago # D-8: a non-UTC process zone so a Date-based day path would shift here, not just on a laptop
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: America/Chicago # a non-UTC server zone, like the laptop's, so the db timezone test can go red here
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # foundation:drift diffs against the v1.3.0 tag; a shallow checkout has no tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Coursework gate (docs/phase-1-tasks.md 1.12): engine purity and date bans, then the oracle agreement, then the
      # fixture freeze — fixtures:check runs AFTER course:eval so a product-code write into fixtures/ fails the tree check.
      - run: npm run foundation:drift
      - run: npm run engine:lint
      - run: npm run course:eval
      - run: npm run progress:verify
      - run: npm run fixtures:check
      - run: createdb coursework_test
      - run: npx prisma migrate deploy
      # Phase 2 (task 2.11): the clone's migration SQL is hand-written (the sandbox has no schema engine), so
      # prove the applied database equals the Prisma schema — any column, index or FK the SQL got wrong fails
      # here. The output goes into the error annotation too: the cloud build session can read annotations
      # through the API but not job logs.
      - run: |
          set +e
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code --script > migrate-diff.sql 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then echo "::error::migrate diff rc=$rc: $(head -c 3500 migrate-diff.sql | tr '\n' ' ')"; cat migrate-diff.sql; exit 1; fi
      - name: RLS enforce leg — app role, system URL
        if: matrix.rls == 'enforce'
        run: |
          psql -d coursework_test -c "CREATE ROLE app_rw LOGIN PASSWORD 'app_rw' NOBYPASSRLS NOSUPERUSER;"
          psql -d coursework_test -c "GRANT USAGE ON SCHEMA public TO app_rw; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_rw; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_rw;"
          echo "RLS_MODE=enforce" >> "$GITHUB_ENV"
          echo "DATABASE_URL_SYSTEM=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://app_rw:app_rw@localhost:5432/coursework_test?connection_limit=8&pool_timeout=20" >> "$GITHUB_ENV"
      - run: npx vitest run
      # Task 2.8 / 2.9 as commands: seed fixtures/ through the write paths into the runner's database, then
      # recompute 341 + 300 progress values from its rows and diff the oracle's answers (0 diffs).
      - run: npx tsx scripts/seed-fixtures.ts --slug ci-fixtures
      - run: npx tsx scripts/progress-verify.ts --db --slug ci-fixtures
      # Production build, served — the way it ships. login.spec.ts drives a real page.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # Spec §4 / §13.3: both modules deleted by the manifest, and the tree must still generate, typecheck, build and pass drift.
  modules-removed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run foundation:check-modules
